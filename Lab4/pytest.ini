[pytest]
# script/ is the import root, so tests can "import common".
pythonpath = script
testpaths = tests
markers =
    e2e: end-to-end tests that run the full pipeline (deselect with -m "not e2e")
    kernel: tests that load the XDP program (need root; run inside the IDS Docker image)
    docker: tests that need the Docker compose stack running
