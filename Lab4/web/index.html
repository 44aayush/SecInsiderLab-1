<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real-time DDoS Detection (XDP)</title>
<style>
:root { color-scheme: dark; --bg: #14161a; --panel: #1e2127; --line: #353a44; --fg: #e6e8eb;
  --gold: #e3b341; --bad: #ff6b6b; --ok: #5fd38d; }
body { margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--fg);
  font: 1rem/1.5 system-ui, sans-serif; }
main { max-width: 64rem; margin-inline: auto; }
h1 { text-align: center; font-size: 1.6rem; }
form { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; justify-content: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: .5rem; padding: 1rem; }
label { display: grid; gap: .25rem; font-weight: 600; }
select, input { background: var(--bg); color: var(--fg); border: 1px solid var(--line);
  border-radius: .25rem; padding: .5rem; font: inherit; min-width: 10rem; }
button { border: 0; border-radius: .25rem; padding: .6rem 1.2rem; font: inherit; font-weight: 700;
  cursor: pointer; }
#start { background: var(--gold); color: #1a1a1a; }
#stop { background: var(--line); color: var(--fg); }
button:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#status { margin: 1rem 0; text-align: center; min-height: 1.5rem; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: var(--panel); }
caption { font-size: 1.2rem; font-weight: 700; padding: .5rem; }
th, td { padding: .5rem .75rem; border-bottom: 1px solid var(--line); text-align: left;
  white-space: nowrap; }
th { color: var(--gold); }
tr.malicious td { background: rgb(255 107 107 / .15); color: var(--bad); font-weight: 600; }
tr.normal td:nth-child(6) { color: var(--ok); }
</style>
</head>
<body>
<main>
<h1>Real-time DDoS Detection (in-kernel XDP)</h1>
<form id="ctl">
  <label>Available Local Interfaces <select id="iface" name="iface"></select></label>
  <label>Enter Timespan (seconds)
    <input id="timespan" name="timespan" type="number" min="1" max="3600" value="30" required></label>
  <label>Model <select id="model" name="model">
    <option>DT</option><option>XGB</option><option selected>ALL</option></select></label>
  <button id="start" type="submit">Start Packet Capture</button>
  <button id="stop" type="button" disabled>Stop</button>
</form>
<p id="status" role="status" aria-live="polite">Idle.</p>
<div class="scroll">
<table>
  <caption>Algorithm Output</caption>
  <thead><tr><th scope="col">Src IP</th><th scope="col">Src Port</th><th scope="col">Dst IP</th>
    <th scope="col">Dst Port</th><th scope="col">Timestamp</th><th scope="col">Result</th>
    <th scope="col">Models</th></tr></thead>
  <tbody id="flows"></tbody>
</table>
</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const FIELDS = ["src_ip", "src_port", "dst_ip", "dst_port", "timestamp", "result", "models"];

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  return {ok: res.ok, data: await res.json().catch(() => ({}))};
}

function render(s) {
  const st = s.stats || {};
  $("status").textContent = s.running
    ? `Running on ${s.iface} (${s.model}), ${s.remaining_s} s left | packets ${st.ST_PKTS ?? 0}, `
      + `dropped ${st.ST_DROP ?? 0}, classified ${st.ST_FLOWS_CLASSIFIED ?? 0}, `
      + `malicious ${st.ST_FLOWS_MALICIOUS ?? 0}, blocks ${st.ST_BLOCKS_ADDED ?? 0}`
    : "Idle.";
  $("start").disabled = s.running;
  $("stop").disabled = !s.running;
  // textContent only: flow data never becomes markup.
  $("flows").replaceChildren(...s.rows.map((r) => {
    const tr = document.createElement("tr");
    tr.className = r.result.toLowerCase();
    for (const f of FIELDS) tr.append(Object.assign(document.createElement("td"), {textContent: r[f]}));
    return tr;
  }));
}

async function poll() {
  try { render((await api("/api/flows")).data); } catch { $("status").textContent = "Server unreachable."; }
}

$("ctl").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const {ok, data} = await api("/api/start",
    {iface: $("iface").value, timespan: Number($("timespan").value), model: $("model").value});
  if (!ok) $("status").textContent = "Error: " + (data.error ?? "start failed");
  else poll();
});
$("stop").addEventListener("click", async () => { await api("/api/stop", {}); poll(); });

(async () => {
  const {data} = await api("/api/interfaces");
  $("iface").replaceChildren(...data.interfaces.map((n) => new Option(n, n, n === data.default, n === data.default)));
  $("model").value = data.model;
  poll();
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
